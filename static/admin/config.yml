# =============================================================================
# Decap CMS 配置文件 — Cloudflare Pages 认证模式
# =============================================================================

# 后端配置 —— 使用 GitHub + 本地认证代理
backend:
  name: github
  repo: fbwe425/blog-cms
  branch: main
  # 不使用外部 OAuth，通过本地认证代理处理

# 媒体文件夹
media_folder: "static/images/uploads"
public_folder: "/images/uploads"

# 本地化
i18n:
  structure: "single_file"
  locales: ["zh", "en"]
  default_locale: "zh"

# =============================================================================
# 集合配置
# =============================================================================

collections:
  - name: "posts"
    label: "📝 文章管理"
    folder: "content/posts"
    path: "{{slug}}"
    create: true
    slug: "{{year}}{{month}}{{day}}-{{slug}}"
    preview_path: "posts/{{slug}}"
    preview_path_date_field: "date"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["date", "title", "_modified_at"]
    sort_reverse: true
    fields:
      - label: "标题"
        name: "title"
        widget: "string"
        pattern: ['^.{1,100}$', "标题长度应在 1-100 个字符之间"]
      - label: "发布日期"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ss+08:00"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        format_utc: false
      - label: "发布状态"
        name: "draft"
        widget: "boolean"
        default: true
        hint: "开启后文章不会在线上显示"
      - label: "文章摘要"
        name: "description"
        widget: "text"
        required: false
        hint: "用于 SEO 和社交媒体预览"
      - label: "正文内容"
        name: "body"
        widget: "markdown"
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
        minimal: false
        editor_components:
          - image
          - code-block
      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
        hint: "为文章添加标签"
        allow_add: true
      - label: "分类"
        name: "categories"
        widget: "select"
        multiple: true
        options:
          - { label: "技术", value: "技术" }
          - { label: "生活", value: "生活" }
          - { label: "公告", value: "公告" }
          - { label: "教程", value: "教程" }
          - { label: "随笔", value: "随笔" }
        required: false
        hint: "选择文章分类"
      - label: "封面图"
        name: "cover"
        widget: "object"
        required: false
        fields:
          - label: "图片"
            name: "image"
            widget: "image"
            required: false
            media_library:
              config:
                max_file_size: 5120000
          - label: "替代文字"
            name: "alt"
            widget: "string"
            required: false
          - label: "图片说明"
            name: "caption"
            widget: "string"
            required: false
          - label: "隐藏封面"
            name: "hidden"
            widget: "boolean"
            default: false
            required: false
      - label: "作者"
        name: "author"
        widget: "string"
        required: false
        default: ""
      - label: "摘要"
        name: "summary"
        widget: "text"
        required: false
        hint: "自定义摘要，不填则自动从正文截取"
      - label: "显示目录"
        name: "showToc"
        widget: "boolean"
        default: true
        required: false
      - label: "目录默认展开"
        name: "TocOpen"
        widget: "boolean"
        default: false
        required: false
      - label: "排除页面"
        name: "exclude"
        widget: "boolean"
        default: false
        required: false
        hint: "开启后此文章不会出现在列表中"

  - name: "pages"
    label: "📄 页面管理"
    folder: "content"
    create: true
    slug: "{{slug}}"
    preview_path: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    exclude:
      - "_index.md"
    fields:
      - label: "标题"
        name: "title"
        widget: "string"
      - label: "发布日期"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ss+08:00"
        format_utc: false
      - label: "发布状态"
        name: "draft"
        widget: "boolean"
        default: true
      - label: "页面描述"
        name: "description"
        widget: "text"
        required: false
      - label: "正文内容"
        name: "body"
        widget: "markdown"
      - label: "布局"
        name: "layout"
        widget: "select"
        options:
          - { label: "默认", value: "_default/single" }
          - { label: "文章列表", value: "_default/list" }
        default: "_default/single"
        required: false
      - label: "URL 路径"
        name: "url"
        widget: "string"
        required: false
        hint: "自定义页面 URL，如 /about"

  - name: "settings"
    label: "⚙️ 网站设置"
    files:
      - name: "general"
        label: "基本设置"
        file: "hugo.toml"
        description: "Hugo 基础配置"
        fields:
          - label: "网站标题"
            name: "title"
            widget: "string"
          - label: "网站描述"
            name: "description"
            widget: "text"
            required: false

      - name: "theme_settings"
        label: "🎨 主题设置"
        file: "data/theme_settings.yml"
        description: "主题外观配置"
        create: true
        fields:
          - label: "默认主题"
            name: "defaultTheme"
            widget: "select"
            options:
              - { label: "自动跟随系统", value: "auto" }
              - { label: "始终亮色", value: "light" }
              - { label: "始终暗色", value: "dark" }
            default: "auto"
          - label: "显示分享按钮"
            name: "ShowShareButtons"
            widget: "boolean"
            default: true
          - label: "显示阅读时间"
            name: "ShowReadingTime"
            widget: "boolean"
            default: true
          - label: "显示面包屑导航"
            name: "ShowBreadCrumbs"
            widget: "boolean"
            default: true
          - label: "显示文章目录"
            name: "ShowToc"
            widget: "boolean"
            default: true
          - label: "显示代码复制按钮"
            name: "ShowCodeCopyButtons"
            widget: "boolean"
            default: true
          - label: "启用搜索"
            name: "search"
            widget: "boolean"
            default: true
          - label: "首页欢迎信息"
            name: "homeInfoParams"
            widget: "object"
            fields:
              - label: "标题"
                name: "Title"
                widget: "string"
              - label: "内容"
                name: "Content"
                widget: "text"
          - label: "作者信息"
            name: "author"
            widget: "string"
            default: ""

      - name: "navigation"
        label: "🔗 导航菜单"
        file: "data/navigation.yml"
        description: "网站导航菜单配置"
        create: true
        fields:
          - label: "主菜单"
            name: "main"
            widget: "list"
            allow_add: true
            fields:
              - label: "名称"
                name: "name"
                widget: "string"
              - label: "链接"
                name: "url"
                widget: "string"
              - label: "权重（排序）"
                name: "weight"
                widget: "number"
                default: 0
                min: 0
