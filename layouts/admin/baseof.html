<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Description }}{{ end }}">
  {{ hugo.Generator }}
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .admin-prompt {
      text-align: center;
      max-width: 500px;
      padding: 2rem;
    }
    .admin-prompt h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #fff;
    }
    .admin-prompt p {
      margin-bottom: 2rem;
      color: #999;
      line-height: 1.6;
    }
    .admin-prompt a {
      display: inline-block;
      padding: 12px 32px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1.1rem;
      transition: background 0.2s;
    }
    .admin-prompt a:hover { background: #1d4ed8; }
    .lock-icon { font-size: 3rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="admin-prompt">
    <div class="lock-icon">🔐</div>
    <h1>后台管理</h1>
    <p>
      需要授权后才能访问后台管理面板。<br>
      请点击下方按钮登录 GitHub 账号进行身份验证。
    </p>
    <a href="/admin/#/">进入管理面板</a>
    <p style="margin-top: 2rem; font-size: 0.85rem; color: #666;">
      如果这是你第一次使用，请先在 <code>static/admin/config.yml</code> 中配置 GitHub OAuth。
    </p>
  </div>
</body>
</html>
