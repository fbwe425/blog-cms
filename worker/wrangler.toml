# =============================================================================
# Cloudflare Worker 配置 — Decap CMS 认证代理
# =============================================================================

name = "blog-cms-auth"
main = "index.js"
compatibility_date = "2024-01-01"

# KV 命名空间
[[kv_namespaces]]
binding = "SESSIONS"
id = "5f7363c5df1e4f168412a6af93849487"

[[kv_namespaces]]
binding = "AUTH_CREDENTIALS"
id = "44b1a8824dff4c1389fbce43c7563681"

# 环境变量
[vars]
GITHUB_REPO = "fbwe425/blog-cms"
